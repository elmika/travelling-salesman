<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Path Drawer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        canvas {
            border: 1px solid black;
            display: block;
            margin: 20px auto;
            max-width: 100%;
        }
        textarea {
            width: 100%;
            height: 100px;
        }
    </style>
</head>
<body>
    <h1>Path Drawer</h1>
    <p>Enter a list of points in JSON format and click "Draw Path". Example:</p>
    <pre>
[
    {"x": 10, "y": 20},
    {"x": 30, "y": 40},
    {"x": 50, "y": 60}
]
    </pre>
    <textarea id="pointsInput" placeholder="Paste your JSON points here"></textarea>
    <button id="drawButton">Draw Path</button>
    <canvas id="pathCanvas"></canvas>

    <script>
        const canvas = document.getElementById("pathCanvas");
        const ctx = canvas.getContext("2d");

        document.getElementById("drawButton").addEventListener("click", () => {
            const pointsInput = document.getElementById("pointsInput").value;

            try {
                const points = JSON.parse(pointsInput);

                if (!Array.isArray(points) || points.length === 0) {
                    alert("Invalid input: Please provide a non-empty array of points.");
                    return;
                }

                // Determine the canvas size based on the points
                const margin = 20; // Add some margin around the points
                const xValues = points.map(p => p.x);
                const yValues = points.map(p => p.y);
                const minX = Math.min(...xValues) - margin;
                const maxX = Math.max(...xValues) + margin;
                const minY = Math.min(...yValues) - margin;
                const maxY = Math.max(...yValues) + margin;

                const pointWidth = maxX - minX;
                const pointHeight = maxY - minY;

                // Set canvas dimensions to take full window width and scale height proportionally
                const canvasWidth = window.innerWidth * 0.9; // Take 90% of the window width
                const scale = canvasWidth / pointWidth; // Scale based on width
                const canvasHeight = pointHeight * scale;

                canvas.width = canvasWidth;
                canvas.height = canvasHeight;

                // Clear the canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Adjust the points to fit the new scale
                const scaleX = canvasWidth / pointWidth;
                const scaleY = canvasHeight / pointHeight;

                // Center and scale the drawing
                ctx.scale(scaleX, scaleY);
                ctx.translate(-minX, -minY);

                // Draw the path
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);

                points.forEach(point => {
                    ctx.lineTo(point.x, point.y);
                });

                // Close the path (connect the last point to the first)
                ctx.lineTo(points[0].x, points[0].y);

                ctx.strokeStyle = "blue";
                ctx.lineWidth = 2 / scaleX; // Adjust line width to scale
                ctx.stroke();

                // Draw the points
                points.forEach(point => {
                    ctx.fillStyle = "red";
                    ctx.beginPath();
                    ctx.arc(point.x, point.y, 3 / scaleX, 0, Math.PI * 2); // Adjust point size to scale
                    ctx.fill();
                });

                // Reset transformation for future drawings
                ctx.resetTransform();
            } catch (error) {
                alert("Invalid JSON input. Please ensure your input is a valid JSON array of points.");
            }
        });

        // Adjust canvas size on window resize
        window.addEventListener("resize", () => {
            document.getElementById("drawButton").click();
        });
    </script>
</body>
</html>
